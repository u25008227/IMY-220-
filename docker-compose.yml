services:
  backend:
    build: ./backend
    container_name: alba-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - alba-network

  frontend:
    build: ./frontend
    container_name: alba-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - alba-network

networks:
  alba-network:
    driver: bridge