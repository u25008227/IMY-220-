services:
  mongodb:
    image: mongo:7
    container_name: alba-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - alba-network

  backend:
    build: ./backend
    container_name: alba-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://admin:admin@mongodb:27017/albaReality?authSource=admin
      - JWT_SECRET=alba_reality_super_secret_key_2026
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - alba-network

  frontend:
    build: ./frontend
    container_name: alba-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - alba-network

volumes:
  mongodb_data:

networks:
  alba-network:
    driver: bridge